[package]
name = "corner-table"
version.workspace = true
edition.workspace = true

[features]
hot-reload = ["gpui/hot-reload"]

[dependencies]
accesskit = "0.24"
anyhow = "1"
chrono = "0.4"
corner-table-api = { path = "../../crates/api" }
corner-table-block-puzzle = { path = "../../games/block-puzzle" }
corner-table-bubble-shooter = { path = "../../games/bubble-shooter" }
corner-table-checkers = { path = "../../games/checkers" }
corner-table-gem-cascade = { path = "../../games/gem-cascade" }
corner-table-hearts = { path = "../../games/hearts" }
corner-table-jigsaw = { path = "../../games/jigsaw" }
corner-table-mahjong = { path = "../../games/mahjong" }
corner-table-mahjong-cubes = { path = "../../games/mahjong-cubes" }
corner-table-match-three = { path = "../../games/match-three" }
corner-table-mine-trails = { path = "../../games/mine-trails" }
corner-table-minesweeper = { path = "../../games/minesweeper" }
corner-table-reversi = { path = "../../games/reversi" }
corner-table-solitaire = { path = "../../games/solitaire" }
corner-table-sudoku = { path = "../../games/sudoku" }
corner-table-word-games = { path = "../../games/word-games" }
dirs = "5"
gpui = { package = "gpui-pre", version = "=0.3.12", default-features = false }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.12", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
include_dir = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
unicode-segmentation = "1"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12", default-features = false, features = ["test-support"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.12", default-features = false, features = ["wayland", "x11"] }

[target.'cfg(target_os = "macos")'.dependencies]
# macOS can compile the shaders on launch with just Command Line Tools installed.
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.12", default-features = false, features = ["font-kit", "runtime_shaders"] }
objc2 = "0.6"
objc2-avf-audio = { version = "0.3.2", default-features = false, features = ["AVAudioPlayer"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSData"] }
