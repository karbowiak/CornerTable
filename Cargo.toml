[workspace]
members = [
    "apps/desktop",
    "crates/api",
    "games/block-puzzle",
    "games/jigsaw",
    "games/mahjong",
    "games/match-three",
    "games/minesweeper",
    "games/solitaire",
    "games/sudoku",
    "games/word-games",
]
default-members = ["apps/desktop"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.dev]
debug = 0
