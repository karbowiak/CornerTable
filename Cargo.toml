[workspace]
members = [
    "apps/desktop",
    "crates/api",
    "crates/dev",
    "games/block-puzzle",
    "games/bubble-shooter",
    "games/checkers",
    "games/gem-cascade",
    "games/hearts",
    "games/jigsaw",
    "games/mahjong",
    "games/mahjong-cubes",
    "games/match-three",
    "games/mine-trails",
    "games/minesweeper",
    "games/reversi",
    "games/solitaire",
    "games/sudoku",
    "games/word-games",
    "xtask",
]
default-members = ["apps/desktop"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.dev]
debug = 0
